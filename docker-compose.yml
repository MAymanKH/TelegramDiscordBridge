version: '3.8'

services:
  telegram-discord-bridge:
    build: .
    container_name: telegram-discord-bridge
    restart: unless-stopped

    volumes:
      # Settings file with credentials (read-only).
      - ./settings.yaml:/app/settings.yaml:ro

      # Persistent message-id mapping DB + ephemeral downloaded media +
      # transcoder workspace. A single mount covers everything the bridge
      # writes. Without this, every container Recreate loses bridge.db
      # and reply chains stop linking across restarts.
      - message-data:/app/messages

    environment:
      - PYTHONUNBUFFERED=1

    # Optional: Override command for debugging
    # command: python -u main.py

volumes:
  message-data:
    driver: local